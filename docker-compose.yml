version: "3.8"

services:
  web: # ✅ indent 2 spaces ใต้ services
    build:
      context: .
      dockerfile: apps/edu-flow-front/Dockerfile
      args:
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_ENDPOINT_URL: ${NEXT_PUBLIC_ENDPOINT_URL}
    container_name: edu-flow-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL}
      - NEXT_PUBLIC_ENDPOINT_URL=${NEXT_PUBLIC_ENDPOINT_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    env_file:
      - apps/edu-flow-front/.env

  api:
    build:
      context: .
      dockerfile: apps/edu-flow-api/Dockerfile
      args:
        DOCKER_DATABASE_URL: ${DOCKER_DATABASE_URL}
    container_name: edu-flow-api
    restart: unless-stopped
    ports:
      - "3333:3333"
      - "5555:5555"
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - apps/edu-flow-api/.env

  db:
    image: postgres:16-alpine
    container_name: edu-flow-db
    ports:
      - "5433:5432"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: edu-flow-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - web
      - api

volumes:
  db_data:
