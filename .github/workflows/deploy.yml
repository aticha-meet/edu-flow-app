name: Auto Deploy to Local Windows

on:
    push:
        branches:
            - main # ทำงานเมื่อ push โค้ดเข้ากิ่ง main

jobs:
    deploy:
        # 💡 เปลี่ยนตรงนี้เป็น self-hosted เพื่อบอกให้ไปรันที่เครื่องของคุณ
        runs-on: self-hosted

        steps:
            - name: Deploy on Windows
              run: |
                    cd D:\project\edu-flow-app

                    git pull origin main

                    docker compose build web api --no-cache
                    docker compose up -d

                    docker image prune -f
